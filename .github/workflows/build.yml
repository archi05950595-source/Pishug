      - name: Save Pishug Java source code in repository
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md build.gradle settings.gradle gradle.properties .gitignore app
          if ! git diff --cached --quiet; then
            git commit -m 'Add Pishug Android source code'
            git push origin HEAD:main
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

            - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'

      - name: Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Pishug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
